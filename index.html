<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matemàtiques 2n ESO · Proporcionalitat</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#666;--line:#000}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--mut:#999;--line:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;line-height:1.65;font-size:18px}
main{max-width:720px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:2.4rem;font-weight:400;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:1.7rem;font-weight:400;margin:0 0 20px}
h3{font-size:1.05rem;margin:28px 0 6px}
p{margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 40px}
button{font:inherit;background:none;color:var(--fg);border:1px solid var(--line);padding:8px 18px;cursor:pointer}
button:hover:not(:disabled),button.on{background:var(--fg);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
button:disabled{color:var(--mut);border-color:var(--mut);cursor:default}
.list button{display:flex;width:100%;text-align:left;padding:16px 4px;border:0;border-top:1px solid var(--line);gap:20px}
.list button:last-child{border-bottom:1px solid var(--line)}
.list button:hover:not(:disabled){padding-left:14px}
.list span{min-width:1.5em}
.tabs{display:flex;gap:8px;margin:0 0 28px}
.back{border:0;padding:0;margin-bottom:28px;text-decoration:underline;color:var(--mut)}
.back:hover{background:none!important;color:var(--fg)!important}
.box{border:1px solid var(--line);padding:14px 18px;margin:14px 0;text-align:center}
table{border-collapse:collapse;margin:14px 0;width:100%}
td,th{border:1px solid var(--line);padding:6px 10px;text-align:center;font-weight:400}
.ex{border:1px solid var(--line);padding:24px}
.q{font-size:1.2rem;margin-bottom:18px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:8px 12px;width:150px;margin-right:8px}
.fb{margin:18px 0 0;min-height:1.6em}
.score{color:var(--mut);margin-top:14px;font-size:.95rem}
.acts{margin-top:18px;display:flex;gap:8px}
@media (max-width:480px){h1{font-size:1.9rem}body{font-size:17px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const fr=(a,b)=>`<sup>${a}</sup>⁄<sub>${b}</sub>`;
const gcd=(a,b)=>b?gcd(b,a%b):a;

/* ---------- Teoria ---------- */
const T={
1:`<h3>Raó</h3><p>Una <b>raó</b> és una relació entre dues magnituds. Ho expressem amb una divisió o una fracció.</p>
<p>Si en una bossa hi ha 6 caramels de gerds i 15 en total, la raó de gerds respecte el total és <b>6/15</b>.</p>
<h3>Proporció</h3><p>Una <b>proporció</b> és una igualtat entre dues raons. Dues raons són proporcionals si són iguals.</p>
<div class="box">a/b = c/d &nbsp;&nbsp; <i>a és a b com c és a d</i></div>
<h3>Exemple</h3><p>La Júlia té 18 llibres i 6 són en anglès. En Younes en té 36 i 12 són en anglès.</p>
<table><tr><th>Júlia</th><th>Younes</th></tr><tr><td>6/18 = 1/3</td><td>12/36 = 1/3</td></tr></table>
<p>Representen la mateixa proporció perquè les dues fraccions són equivalents.</p>`,
2:`<h3>Comprovar si dues raons són proporcionals</h3><p>Multipliquem en creu. Si dona el mateix resultat, són proporcionals.</p>
<div class="box">a/b = c/d &nbsp;⇔&nbsp; a · d = b · c</div>
<p>Exemple: 1/4 i 2/8 → 1 · 8 = 4 · 2. Sí que són proporcionals.</p>
<h3>Trobar el valor que falta (regla de tres)</h3><p>1r. Multipliquem en diagonal.<br>2n. Dividim per l’altre número.</p>
<div class="box">9/15 = 21/x<br>x · 9 = 21 · 15<br>x = 315 / 9 = 35</div>`,
3:`<h3>Dues situacions</h3><p><b>Situació 1.</b> Una revista costa 1,25 €. Si comprem més revistes, pagarem més.</p>
<p><b>Situació 2.</b> 4 aixetes omplen una piscina en 20 hores. Si hi ha més aixetes, tardarà menys.</p>
<table><tr><th>Proporcionalitat directa</th><th>Proporcionalitat inversa</th></tr>
<tr><td>Si una magnitud augmenta, l’altra també. Si una disminueix, l’altra també.</td><td>Si una augmenta, l’altra disminueix.</td></tr></table>`,
4:`<h3>Proporcionalitat directa</h3><p>Dues magnituds són <b>directament proporcionals</b> si:</p>
<p>Quan multipliquem una per un nombre, l’altra queda multiplicada pel mateix nombre.<br>Quan dividim una per un nombre, l’altra queda dividida pel mateix nombre.</p>
<table><tr><td>Nº de revistes</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><td>Preu (€)</td><td>1,25</td><td>2,50</td><td>3,75</td><td>5</td></tr></table>
<h3>Constant de proporcionalitat</h3><p>És la raó entre les dues magnituds: el <b>quocient</b>. Aquí: 1,25 € per revista.</p>
<p>Exemple: 1 garrafa costa 0,80 €. 12 garrafes costen 12 · 0,80 = 9,60 €.</p>`,
5:`<h3>Proporcionalitat inversa</h3><p>Dues magnituds són <b>inversament proporcionals</b> si:</p>
<p>Quan multipliquem una per un nombre, l’altra queda dividida pel mateix nombre.<br>Quan dividim una per un nombre, l’altra queda multiplicada pel mateix nombre.</p>
<p>Exemple: 4 persones construeixen un mur en 12 dies. Amb el doble de gent, tardarem la meitat de dies.</p>
<table><tr><td>Persones</td><td>2</td><td>4</td><td>6</td><td>10</td></tr><tr><td>Dies</td><td>24</td><td>12</td><td>8</td><td>4,8</td></tr></table>
<h3>Constant de proporcionalitat</h3><p>Quan la proporcionalitat és inversa, la raó és el <b>producte</b> de les dues magnituds, no la divisió. Aquí: 4 · 12 = 48.</p>
<h3>Regla de tres inversa</h3><p>6 persones fan un treball en 12 dies. Quant tardarien 8 persones?</p>
<div class="box">12 · 6 = 8 · x<br>x = 72 / 8 = 9 dies</div>`,
6:`<h3>Percentatge, fracció i decimal</h3><p>Un percentatge és una raó amb denominador 100.</p>
<table><tr><td>%</td><td>25</td><td>20</td><td>80</td><td>5</td><td>2</td><td>30</td><td>70</td><td>4</td><td>10</td></tr>
<tr><td>Fracció</td><td>1/4</td><td>1/5</td><td>4/5</td><td>1/20</td><td>1/50</td><td>3/10</td><td>7/10</td><td>1/25</td><td>1/10</td></tr>
<tr><td>Decimal</td><td>0,25</td><td>0,2</td><td>0,8</td><td>0,05</td><td>0,02</td><td>0,3</td><td>0,7</td><td>0,04</td><td>0,1</td></tr></table>
<h3>Calcular un percentatge</h3><div class="box">p % de N = N · p / 100</div>
<p>Exemple: el 25 % de 80 és 80 · 25 / 100 = 20.</p>
<p>Si en Jacint ven 36 kg de 48 kg, la raó és 36/48 = 3/4 = 0,75, és a dir, el 75 %.</p>`
};

/* ---------- Exercicis ---------- */
// {q, a:número | opts+a:índex, sol}
const G={
1(){
 const b=R(2,6),v=R(2,6),r=R(2,6),t=b+v+r;
 const n={blaus:b,verds:v,vermells:r};
 const k=pick(Object.keys(n));
 return {q:`En una bossa hi ha ${b} caramels blaus, ${v} de verds i ${r} de vermells. Quina és la raó de caramels ${k} respecte el total? (escriu-ho com a fracció, per exemple 2/5)`,a:n[k]/t,frac:1,sol:`${n[k]}/${t}`};
},
2(){
 const a=R(2,9),b=R(2,9),k=R(2,9),c=a*k,d=b*k,p=R(0,3);
 const s=[`x/${b} = ${c}/${d}`,`${a}/x = ${c}/${d}`,`${a}/${b} = x/${d}`,`${a}/${b} = ${c}/x`][p];
 return {q:`Troba x perquè es compleixi la proporció: ${s}`,a:[a,b,c,d][p],sol:[a,b,c,d][p]};
},
3(){
 const P=[["Nombre de llibres i preu que pagues",0],["Nombre d’obrers i dies que tarden a fer una obra",1],["Quilos de tomàquets i preu",0],["Velocitat d’un cotxe i temps que triga a fer un trajecte",1],["Nombre d’aixetes obertes i temps a omplir una piscina",1],["Nombre de garrafes d’aigua i preu total",0],["Persones que mengen una pizza i tros que li toca a cadascuna",1],["Metres de tela i preu",0]];
 const [t,a]=pick(P);
 return {q:`${t}: quin tipus de proporcionalitat és?`,opts:["Directa","Inversa"],a,sol:["directa","inversa"][a]};
},
4(){
 const p=pick([0.5,0.8,1.2,1.5,2.5]),n=R(5,12);
 const r=Math.round(p*n*100)/100;
 return {q:`Una garrafa d’aigua costa ${String(p).replace('.',',')} €. Quant costen ${n} garrafes? (en €)`,a:r,sol:String(r).replace('.',',')};
},
5(){
 const p=pick([2,3,4,6]),d=pick([12,18,24,30]),q=pick([2,3,4,6,12].filter(x=>x!==p&&(p*d)%x===0));
 return {q:`${p} persones construeixen un mur en ${d} dies. Quants dies tardarien ${q} persones?`,a:p*d/q,sol:p*d/q};
},
6(){
 const p=pick([5,10,20,25,30,40,50,75]),N=pick([40,80,120,200,240,360]);
 return {q:`Quant és el ${p} % de ${N}?`,a:N*p/100,sol:N*p/100};
}
};

const S=[
 ["Raó i proporció",1],["Càlcul amb raons i proporcions",2],["Situacions de proporcionalitat",3],
 ["Proporcionalitat directa",4],["Proporcionalitat inversa",5],["Proporcionalitat en percentatges",6],
 ["Teorema de Tales. Proporcionalitat aplicada",0],["Semblança",0]
];

const app=document.getElementById("app");
let cur=null,tab="t",ex=null,done=false,ok=0,tot=0;

function home(){
 cur=null;
 app.innerHTML=`<h1>Proporcionalitat</h1><p class="sub">Matemàtiques 2n d’ESO · Bloc 1</p>
 <div class="list">${S.map(([n,k],i)=>`<button ${k?`data-k="${k}"`:"disabled"}><span>${i+1}.</span>${n}${k?"":" (aviat)"}</button>`).join("")}</div>`;
 app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>open(+b.dataset.k));
}
function open(k){cur=k;tab="t";ok=tot=0;render();}
function render(){
 const i=S.findIndex(s=>s[1]===cur);
 app.innerHTML=`<button class="back" id="bk">Tornar als apartats</button><h2>${i+1}. ${S[i][0]}</h2>
 <div class="tabs"><button id="bt" class="${tab=="t"?"on":""}">Teoria</button><button id="be" class="${tab=="e"?"on":""}">Exercicis</button></div>
 <div id="c"></div>`;
 bk.onclick=home;
 bt.onclick=()=>{tab="t";render()};
 be.onclick=()=>{tab="e";newEx();render()};
 if(tab=="t")c.innerHTML=T[cur];else drawEx();
}
function newEx(){ex=G[cur]();done=false;}
function drawEx(){
 if(!ex)newEx();
 c.innerHTML=`<div class="ex"><div class="q">${ex.q}</div>
 ${ex.opts?`<div class="opts">${ex.opts.map((o,i)=>`<button data-i="${i}">${o}</button>`).join("")}</div>`
 :`<input id="in" inputmode="decimal" autocomplete="off" aria-label="Resposta"><button id="ck">Comprova</button>`}
 <div class="fb" id="fb" aria-live="polite"></div>
 <div class="acts"><button id="nx">Un altre exercici</button></div>
 <div class="score">Encerts: ${ok} de ${tot}</div></div>`;
 nx.onclick=()=>{newEx();drawEx()};
 if(ex.opts)c.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>check(+b.dataset.i==ex.a));
 else{ck.onclick=()=>{const v=parse(in_.value||document.getElementById("in").value);check(v!==null&&Math.abs(v-ex.a)<1e-6)};
  document.getElementById("in").onkeydown=e=>{if(e.key=="Enter")ck.click()};document.getElementById("in").focus();}
}
const in_={};
function parse(s){
 s=s.trim().replace(",",".");
 if(s.includes("/")){const [a,b]=s.split("/").map(Number);return b?a/b:null}
 const n=Number(s);return s===""||isNaN(n)?null:n;
}
function check(good){
 if(done)return;
 done=true;tot++;if(good)ok++;
 document.getElementById("fb").textContent=good?"Correcte.":`Incorrecte. La resposta és ${ex.sol}.`;
 c.querySelector(".score").textContent=`Encerts: ${ok} de ${tot}`;
}
home();
</script>
</body>
</html>
